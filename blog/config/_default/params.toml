colorScheme = "ocean"

# 홈/recent·RSS가 다룰 섹션 (geeknews 섹션은 여기 없으므로 자동 제외)
mainSections = ["posts"]
# 배제 카테고리 (섹션 분리 후엔 방어용 — geeknews 글은 이제 카테고리 자체가 없음, 유동적)
excludeCategories = ["geeknews"]
# 홈 first viewport에 정사각형 타일로 띄울 포트폴리오 버티컬 (유동적 — 카테고리 늘면 여기만 수정)
featuredVerticals = [ { category = "ps", label = "PS", subtitle = "알고리즘 문제 풀이" }, { category = "android", label = "Android", subtitle = "안드로이드 개발" } ]
defaultAppearance = "light"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
enableImageLazyLoading = true
enableImageWebp = true

fingerprintAlgorithm = "sha256"

[header]
  layout = "basic"
  showTitle = true

[footer]
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "page"
  showRecent = true
  recentLimit = 10

[article]
  showDate = true
  showAuthor = false
  showBreadcrumbs = true
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = false
  showTableOfContents = false
  showTaxonomies = true
  showWordCount = false
  showComments = true

[list]
  showBreadcrumbs = true
  showSummary = false
  showTableOfContents = false
  showTaxonomies = true
  groupByYear = true

[taxonomy]
  showTermCount = true
